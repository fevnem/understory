<!doctype html>
<html lang="en" data-theme="dusk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Understory — a study forest</title>
<meta name="description" content="Plant a tree, not a timer. A quiet forest that grows while you study, with real rain, wind and light — no accounts, no build step, works offline.">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#12161a">
<meta property="og:title" content="Understory — a study forest">
<meta property="og:description" content="Plant a tree, not a timer.">
<meta property="og:type" content="website">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/shell.css">
</head>
<body>
<canvas id="gl" aria-hidden="true"></canvas>
<div id="atmos" aria-hidden="true"><div class="atmos-rain"></div><div class="atmos-veil"></div></div>

<header class="masthead">
  <h1 class="wordmark">Understory</h1>
  <p class="thesis">Plant a tree, not a timer.</p>
  <p class="masthead-note" data-role="totals" aria-live="polite"></p>
  <p class="masthead-warn" data-role="degraded" hidden>Rendering quietly — your device is on the still-image forest.</p>
</header>

<main id="ui">
  <section id="instrument" class="panel" aria-label="Session"></section>
  <aside id="garden" class="panel" aria-label="Your forest" hidden></aside>
</main>

<footer class="colophon">
  <span>Everything runs here, in this page. Nothing is uploaded, nothing is tracked.</span>
  <span class="colophon-keys"><kbd>space</kbd> sow · <kbd>a</kbd> abandon · <kbd>s</kbd> skip · <kbd>g</kbd> forest · <kbd>m</kbd> mute</span>
</footer>

<noscript><p class="noscript">Understory needs JavaScript for the forest and the timer. The page works without it, the trees do not.</p></noscript>
<script type="module" src="js/main.js"></script>
</body>
</html>
